<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <!-- Ícone orbital -->
  <g transform="translate(4, 4)">
    <!-- Círculo central (planeta) -->
    <circle cx="20" cy="20" r="7" fill="url(#grad_planet)"/>
    <!-- Anel orbital externo -->
    <ellipse cx="20" cy="20" rx="18" ry="7" stroke="url(#grad_ring)" stroke-width="1.5" fill="none" opacity="0.9"/>
    <!-- Anel orbital inclinado -->
    <ellipse cx="20" cy="20" rx="14" ry="5" stroke="url(#grad_ring2)" stroke-width="1" fill="none" opacity="0.6" transform="rotate(-30, 20, 20)"/>
    <!-- Ponto brilhante no anel -->
    <circle cx="38" cy="20" r="2.5" fill="#a78bfa"/>
    <!-- Estrelas pequenas -->
    <circle cx="5" cy="5" r="1" fill="white" opacity="0.7"/>
    <circle cx="35" cy="8" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="8" cy="33" r="1" fill="white" opacity="0.6"/>
    <circle cx="32" cy="35" r="0.8" fill="white" opacity="0.5"/>
  </g>

  <!-- Texto: CONTABIL -->
  <text x="54" y="22" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="url(#grad_text)">CONTABIL</text>
  <!-- Texto: SAAS -->
  <text x="54" y="38" font-family="'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="400" letter-spacing="5" fill="#94a3b8">SAAS</text>

  <defs>
    <radialGradient id="grad_planet" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <linearGradient id="grad_ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="grad_ring2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="grad_text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
</svg>
