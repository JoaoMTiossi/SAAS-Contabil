<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#0f0a1e"/>
  <!-- Planeta -->
  <circle cx="16" cy="16" r="6" fill="url(#fp)"/>
  <!-- Anel -->
  <ellipse cx="16" cy="16" rx="14" ry="5.5" stroke="url(#fr)" stroke-width="1.5" fill="none" opacity="0.9"/>
  <!-- Ponto brilhante -->
  <circle cx="30" cy="16" r="2" fill="#a78bfa"/>
  <!-- Estrelas -->
  <circle cx="4" cy="5" r="0.8" fill="white" opacity="0.8"/>
  <circle cx="28" cy="6" r="0.7" fill="white" opacity="0.6"/>
  <circle cx="5" cy="26" r="0.8" fill="white" opacity="0.7"/>
  <defs>
    <radialGradient id="fp" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <linearGradient id="fr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#a78bfa" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
</svg>
